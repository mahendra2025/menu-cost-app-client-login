name: Production Build Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      ADMIN_SESSION_SECRET: build-check-secret-not-for-production
      ADMIN_USER_ID: build-owner@example.com
      ADMIN_PASSWORD: build-check-password
      SINGLE_USER_ID: build-owner@example.com
      SINGLE_USER_PASSWORD: build-check-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
