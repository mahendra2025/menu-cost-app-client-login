services:
  db:
    image: postgres:16-alpine
    container_name: menu-cost-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: menucostapp
      POSTGRES_USER: menucostapp
      POSTGRES_PASSWORD: menucostapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menucostapp -d menucostapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: menu-cost-app-ollama
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
