<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="55" y1="35" x2="1025" y2="1045" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#080C13"/>
      <stop offset="1" stop-color="#061A34"/>
    </linearGradient>
    <linearGradient id="cta" x1="335" y1="0" x2="745" y2="0" gradientUnits="userSpaceOnUse">
